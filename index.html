<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Петергофский цикл</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #050507;
    --surface: #0d090c;
    --surface2: #151014;
    --surface3: #21161b;
    --border: #382027;
    --text: #eef3f8;
    --text-muted: #8a97ab;
    --accent: #f01f3d;
    --accent-dim: #7a1020;
    --steel: #a33a4a;
    --up: #4ade80;
    --down: #ff5c67;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  button, input, label, a{ -webkit-tap-highlight-color: transparent; }
  button:focus, button:focus-visible, input:focus-visible{ outline: none; box-shadow: none; }
  button::-moz-focus-inner{ border: 0; }
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(700px 480px at 8% 10%, rgba(220,20,45,.14), transparent 68%),
      radial-gradient(620px 460px at 92% 22%, rgba(120,8,25,.12), transparent 70%),
      radial-gradient(800px 520px at 50% 100%, rgba(170,12,35,.09), transparent 72%),
      linear-gradient(180deg, #050306 0%, #080306 48%, #020203 100%);
    color: var(--text);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 50% 0%,rgba(255,35,60,.08),transparent 34%);}
  body::after{content:'';position:fixed;inset:-20%;pointer-events:none;z-index:-1;background:radial-gradient(180px 180px at 18% 24%,rgba(245,25,55,.08),transparent 70%),radial-gradient(240px 240px at 82% 62%,rgba(190,15,40,.07),transparent 72%),radial-gradient(140px 140px at 64% 16%,rgba(255,45,70,.055),transparent 70%);filter:blur(2px);animation:ambientFloat 18s ease-in-out infinite alternate;}
  @keyframes ambientFloat{from{transform:translate3d(-1%,0,0) scale(1)}to{transform:translate3d(1%,1.5%,0) scale(1.04)}}
  .mono{ font-family:'Roboto Mono', monospace; }
  #app{ max-width: 980px; margin: 0 auto; padding: 16px 16px 80px; }

  /* ---------- creator signature ---------- */
  .creator-badge{ margin-left:-10px;
    display:inline-flex; align-items:baseline; gap:5px; margin-bottom:7px;
    padding: 2px 8px 3px 7px; border-radius: 999px;
    background: linear-gradient(135deg, rgba(227,38,54,0.12), rgba(143,57,69,0.12));
    border: 1px solid var(--border);
  }
  .creator-badge .cb-label{ font-family:'Roboto Mono',monospace; font-size:7px; letter-spacing:.55px; text-transform:uppercase; color: var(--text-muted); }
  .creator-badge .cb-name{
    font-family:'Caveat', cursive; font-weight:700; font-size:13px; line-height:1;
    background: linear-gradient(90deg, var(--accent), var(--steel));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom: 3px solid var(--accent);
    padding-bottom: 14px; margin-bottom: 18px;
    flex-wrap: wrap; gap: 10px;
  }
  .brand{
    font-weight: 700; font-size: 24px; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .brand span{ color: var(--accent); }
  .brand small{
    display:block; font-family:'Roboto Mono',monospace; font-size:11px; letter-spacing:1px;
    color: var(--text-muted); font-weight:400; text-transform:none; margin-top:2px;
  }
  .topbar-actions{ display:flex; gap:8px; }
  .icon-btn{
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted);
    font-family:'Roboto Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    padding: 8px 12px; cursor:pointer; border-radius: var(--radius);
  }
  .icon-btn:hover{ color: var(--text); border-color: var(--steel); }

  /* ---------- tabs ---------- */
  .tab-nav{ display:flex; gap:8px; margin-bottom:22px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .tab-nav::-webkit-scrollbar{display:none;}
  .tab-btn{min-width:150px;}
  .tab-btn{
    flex:1; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    font-family:'Roboto Mono',monospace; font-size: 12px; letter-spacing:1.5px; text-transform:uppercase;
    padding: 13px; cursor:pointer; border-radius: var(--radius); text-align:center;
    transition: background .25s ease, color .25s ease, border-color .25s ease, transform .15s ease;
  }
  .tab-btn.active{ background: var(--accent); border-color: var(--accent); color: #14161a; font-weight:700; animation: tabActivePulse .4s cubic-bezier(.34,1.56,.64,1); }
  .tab-btn:hover:not(.active){ border-color: var(--steel); color: var(--text); transform: translateY(-2px); }
  .tab-btn:active{ transform: scale(0.94); }

  @keyframes tabFadeIn{
    from{ opacity:0; transform: translateY(26px) scale(.96); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  @keyframes tabActivePulse{
    0%{ transform: scale(1); }
    45%{ transform: scale(1.08); }
    100%{ transform: scale(1); }
  }
  #tab-content{ animation: tabFadeIn .5s cubic-bezier(.22,1,.36,1); }
  #tab-content .panel{ animation: tabFadeIn .55s cubic-bezier(.22,1,.36,1) both; }
  #tab-content .panel:nth-of-type(2){ animation-delay: .08s; }
  #tab-content .panel:nth-of-type(3){ animation-delay: .16s; }
  #tab-content .panel:nth-of-type(4){ animation-delay: .24s; }


  .food-subnav{display:flex;gap:6px;margin:-4px 0 14px;}
  .food-subbtn{border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);border-radius:999px;padding:7px 12px;font:500 10px 'Roboto Mono',monospace;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
  .food-subbtn.active{background:rgba(240,31,61,.16);border-color:var(--accent);color:var(--text);}
  .stat-day{border:1px solid var(--border);background:linear-gradient(135deg,rgba(255,255,255,.018),rgba(240,31,61,.035));border-radius:10px;padding:14px;margin-bottom:10px;}
  .stat-day-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:9px;}
  .stat-date{font:700 12px 'Roboto Mono',monospace;color:var(--text);}
  .stat-total{font:700 11px 'Roboto Mono',monospace;color:var(--accent);}
  .stat-food{font-size:11px;color:var(--text-muted);line-height:1.7;}
  .stat-empty{padding:28px 0;text-align:center;color:var(--text-muted);font:11px 'Roboto Mono',monospace;}
  @media(max-width:600px){.creator-badge{margin-left:-4px}.brand{font-size:20px}.tab-nav{gap:5px}.tab-btn{min-width:128px;padding:11px 8px;font-size:10px}.food-subbtn{padding:7px 10px}.calc-big{font-size:28px}}


  /* ---------- 1RM calculator ---------- */
  .calc-tabs{display:flex;gap:7px;margin-bottom:16px;}
  .calc-mode{flex:1;border:1px solid var(--border);background:var(--surface2);color:var(--text-muted);border-radius:9px;padding:10px;font:600 10px 'Roboto Mono',monospace;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;}
  .calc-mode.active{background:rgba(240,31,61,.16);border-color:var(--accent);color:var(--text);}
  .calc-result{margin-top:18px;padding:18px;border:1px solid var(--accent-dim);background:linear-gradient(135deg,rgba(240,31,61,.10),rgba(255,255,255,.015));border-radius:12px;}
  .calc-formula{font:600 14px 'Roboto Mono',monospace;line-height:1.7;color:var(--text);word-break:break-word;}
  .calc-formula b{color:var(--accent);}
  .calc-big{font:800 34px 'Roboto Mono',monospace;color:var(--accent);margin-top:7px;}
  .calc-note{margin-top:8px;color:var(--text-muted);font-size:11px;line-height:1.55;}
  /* ---------- support modal ---------- */
  .support-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;animation:supportIn .25s ease;}
  .support-card{width:min(430px,100%);background:linear-gradient(145deg,#180b10,#0b0709);border:1px solid rgba(240,31,61,.45);box-shadow:0 24px 80px rgba(0,0,0,.65),0 0 55px rgba(240,31,61,.12);border-radius:20px;padding:28px 24px;text-align:center;position:relative;animation:supportCardIn .35s cubic-bezier(.22,1,.36,1);}
  .support-icon{width:68px;height:68px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(240,31,61,.13);border:1px solid rgba(240,31,61,.3);font-size:32px;}
  .support-title{font-size:19px;font-weight:800;margin-bottom:9px;}
  .support-text{font-size:13px;line-height:1.65;color:var(--text-muted);}
  .support-text b{color:var(--text);}
  .support-close{margin-top:19px;width:100%;border:0;border-radius:10px;padding:12px;background:var(--accent);color:#fff;font:700 11px 'Roboto Mono',monospace;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
  @keyframes supportIn{from{opacity:0}to{opacity:1}}
  @keyframes supportCardIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

  /* ---------- loading ---------- */
  #loading{ padding: 60px 0; text-align:center; color: var(--text-muted); font-family:'Roboto Mono',monospace; letter-spacing:1px; }

  /* ---------- setup form ---------- */
  .panel{
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 18px;
  }
  .panel-title{
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent);
    font-weight: 600; margin: 0 0 16px 0; display:flex; align-items:center; gap:8px;
  }
  .panel-title::before{ content:''; width:18px; height:2px; background:var(--accent); display:inline-block; }
  .field-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 680px){ .field-grid{ grid-template-columns: 1fr 1fr; } }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; }
  .field input, .field select{
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 9px 10px; font-family:'Roboto Mono', monospace; font-size: 14px; border-radius: var(--radius);
    width: 100%;
  }
  .field input:focus, .field select:focus{ outline:none; border-color: var(--accent); }
  .field-inline{ display:flex; align-items:center; gap:6px; }
  .field-inline input[type=number]{ width: 90px; }

  .accessory-row{
    display:grid; grid-template-columns: 1fr 130px 100px 34px;
    gap: 10px; align-items:center; padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .accessory-row:last-child{ border-bottom:none; }
  .accessory-row input[type=text]{ background: var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:var(--radius); font-family:'Sora',sans-serif; font-size:14px; width:100%; }
  .accessory-row select{ background: var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 8px; border-radius:var(--radius); font-size:13px; }
  .accessory-row .num-wrap{ display:flex; align-items:center; gap:4px; }
  .accessory-row input[type=number]{ background: var(--surface2); border:1px solid var(--border); color:var(--text); padding:8px 6px; border-radius:var(--radius); font-family:'Roboto Mono',monospace; width:100%; }
  .remove-btn{ background:none; border:1px solid var(--border); color:var(--down); cursor:pointer; width:30px; height:30px; border-radius:var(--radius); line-height:1; }
  .remove-btn:hover{ background: var(--down); color: var(--surface); }

  .add-row-btn{
    margin-top: 12px; background:none; border: 1px dashed var(--border); color: var(--text-muted);
    padding: 9px 14px; cursor:pointer; font-family:'Roboto Mono',monospace; font-size:12px; letter-spacing:.5px;
    border-radius: var(--radius); width:100%; text-transform:uppercase;
  }
  .add-row-btn:hover{ border-color: var(--steel); color: var(--text); }

  .primary-btn{
    background: var(--accent); color: #14161a; border:none; font-weight:700; letter-spacing: 1px;
    text-transform: uppercase; padding: 13px 22px; cursor:pointer; font-family:'Sora',sans-serif;
    font-size: 15px; border-radius: var(--radius); margin-top: 4px;
    transition: background .2s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .primary-btn:hover{ background:#3ee6cc; transform: translateY(-2px) scale(1.015); }
  .primary-btn:active{ transform: scale(0.95); }
  .hint{ font-size:12px; color: var(--text-muted); margin-top: 8px; line-height:1.5; }

  /* ---------- retest / new cycle panel ---------- */
  .retest-panel{ border-color: var(--accent); }
  .retest-panel .panel-title{ margin-bottom: 6px; }
  .retest-panel .field-grid{ margin-top: 14px; margin-bottom: 4px; }

  /* ---------- week nav ---------- */
  .week-nav{
    display:flex; gap:6px; overflow-x:auto; padding-bottom: 6px; margin-bottom: 20px;
  }
  .week-pill{
    flex: 0 0 auto; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    font-family:'Roboto Mono',monospace; font-size: 12px; padding: 9px 13px; cursor:pointer; border-radius: var(--radius);
    text-align:center; min-width: 58px;
  }
  .week-pill span{ display:block; font-size:9px; letter-spacing:1px; text-transform:uppercase; margin-bottom:2px; }
  .week-pill.active{ background: var(--accent); border-color: var(--accent); color: #14161a; font-weight:700; }
  .week-pill.final{ border-color: var(--accent); }
  .week-pill:hover:not(.active){ border-color: var(--steel); color: var(--text); }

  /* ---------- day cards ---------- */
  .day-card{
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 16px; overflow:hidden;
  }
  .day-head{
    background: var(--surface3); padding: 12px 18px; display:flex; justify-content:space-between; align-items:baseline;
    border-bottom: 2px solid var(--accent);
  }
  .day-head .day-name{ font-size:16px; font-weight:700; text-transform:uppercase; letter-spacing:1px; }
  .day-head .day-focus{ font-size:12px; color: var(--text-muted); font-family:'Roboto Mono',monospace; }
  .deload-row{border-color:rgba(255,31,61,.55);background:rgba(255,31,61,.035)}
.ex-row{
    display:flex; flex-direction:column; gap:10px;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .ex-row:last-child{ border-bottom: none; }
  .ex-row.main-ex{ background: rgba(212,87,42,0.06); }
  .ex-top{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .ex-name{ font-size:14px; }
  .ex-name .max-tag{ display:block; font-family:'Roboto Mono',monospace; font-size:10px; color: var(--text-muted); margin-top:2px; }
  .ex-right{ display:flex; align-items:center; gap:14px; }
  .weight-box{ text-align:center; min-width:74px; }
  .weight-box .kg{ font-family:'Roboto Mono',monospace; font-size:17px; font-weight:700; color: var(--text); }
  .weight-box .unit{ font-size:10px; color: var(--text-muted); }
  .bar-track{ height:3px; background: var(--surface2); margin-top:5px; border-radius:2px; overflow:hidden; }
  .bar-fill{ height:100%; background: var(--accent); }
  .delta-tag{
    font-family:'Roboto Mono',monospace; font-size:11px; text-align:center; padding: 7px 9px; border-radius: var(--radius);
    background: var(--surface2); color: var(--text-muted); white-space:nowrap;
  }
  .delta-tag.up{ color: var(--up); }
  .delta-tag.down{ color: var(--down); }

  .sets-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sets-grid.has-failure{ grid-template-columns: repeat(4, 1fr) 1.15fr; }
  @media (max-width: 480px){
    .sets-grid{ grid-template-columns: repeat(4, 1fr); }
    .sets-grid.has-failure{ grid-template-columns: repeat(5, 1fr); }
  }
  .set-mini{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .set-mini label{ font-size:9px; color: var(--text-muted); text-transform:uppercase; letter-spacing:.5px; }
  .set-mini input{
    width:100%; background: var(--surface2); border:1px solid var(--border); color: var(--text);
    font-family:'Roboto Mono',monospace; font-size:13px; text-align:center; padding:7px 2px; border-radius: var(--radius);
  }
  .set-mini input:focus{ outline:none; border-color: var(--steel); }
  .set-mini.failure label{ color: var(--accent); font-weight:600; }
  .set-mini.failure input{ border-color: var(--accent); background: rgba(212,87,42,0.08); }

  /* ---------- kbju ---------- */
  .kbju-stat{ font-family:'Roboto Mono',monospace; font-size: 22px; font-weight:700; }
  .kbju-stat.accent{ color: var(--accent); }
  .kbju-macros{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  @media (max-width: 480px){ .kbju-macros{ grid-template-columns: 1fr; } }
  .kbju-macro{
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; text-align:center; display:flex; flex-direction:column; gap:5px;
  }
  .kbju-macro span{ font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color: var(--text-muted); }
  .kbju-macro b{ font-family:'Roboto Mono',monospace; font-size: 20px; color: var(--text); }
  .kbju-macro small{ font-family:'Roboto Mono',monospace; font-size: 11px; color: var(--text-muted); }

  /* ---------- kbju: radio-style inputs (form) ---------- */
  .num-input{ position:relative; }
  .num-input input[type=number]{ padding-right:28px; -moz-appearance:textfield; }
  .num-input input[type=number]::-webkit-outer-spin-button,
  .num-input input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .num-input .steppers{
    position:absolute; right:1px; top:1px; bottom:1px; width:22px;
    display:flex; flex-direction:column; border-left:1px solid var(--border);
  }
  .num-input .steppers button{
    flex:1; border:none; background:var(--surface3); cursor:pointer; font-size:8px;
    color: var(--text-muted); line-height:1; padding:0; border-radius:0;
  }
  .num-input .steppers button:first-child{ border-bottom:1px solid var(--border); }
  .num-input .steppers button:hover{ color: var(--text); background:var(--border); }

  .radio-row{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .radio-opt{
    display:flex; align-items:center; gap:9px; font-size:13px; color: var(--text); cursor:pointer;
  }
  .radio-opt input[type=radio]{
    appearance:none; width:17px; height:17px; border:2px solid var(--border); border-radius:50%;
    position:relative; cursor:pointer; margin:0; flex-shrink:0; background:var(--surface2);
  }
  .radio-opt input[type=radio]:checked{ border-color: var(--accent); }
  .radio-opt input[type=radio]:checked::after{
    content:''; position:absolute; inset:3px; background:var(--accent); border-radius:50%;
  }
  .radio-list{ display:flex; flex-direction:column; gap:12px; }
  .radio-list .radio-opt{ align-items:flex-start; }
  .radio-list .radio-opt input[type=radio]{ margin-top:2px; }
  .field-sublabel{
    font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px;
    margin-bottom: 10px;
  }

  .legend{
    font-size: 11px; color: var(--text-muted); line-height:1.7; font-family:'Roboto Mono',monospace;
    background: var(--surface); border:1px solid var(--border); padding: 14px 18px; border-radius: var(--radius); margin-top: 24px;
  }
  .legend b{ color: var(--text); }
  .footer-note{ text-align:center; color: var(--text-muted); font-size:11px; margin-top:20px; font-family:'Roboto Mono',monospace;}
  .empty-note{ color: var(--text-muted); font-size: 14px; line-height:1.6; margin: 0 0 16px 0; }

  /* ---------- питание ---------- */
  .food-upload-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .food-text-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .food-text-row input[type=text]{
    flex: 1 1 220px; background: var(--surface2); border:1px solid var(--border); color:var(--text);
    padding:9px 10px; font-family:'Sora',sans-serif; font-size:14px; border-radius:var(--radius);
  }
  .food-text-row input[type=text]:focus{ outline:none; border-color: var(--accent); }
  .food-text-btn{
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    font-family:'Roboto Mono',monospace; font-size:12px; letter-spacing:.5px; text-transform:uppercase;
    padding: 9px 14px; cursor:pointer; border-radius: var(--radius); white-space:nowrap;
    transition: border-color .2s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .food-text-btn:hover{ border-color: var(--steel); transform: translateY(-2px); }
  .food-text-btn:active{ transform: scale(0.94); }
  .food-text-btn:disabled{ opacity:0.5; pointer-events:none; }
  .food-upload-btn{
    display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
    background: var(--accent); color:#0b1220; font-family:'Sora', sans-serif; font-weight:600;
    letter-spacing:0.5px; text-transform:uppercase; font-size:13px; padding:11px 18px; border-radius: var(--radius);
    transition: opacity .15s, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .food-upload-btn:hover{ opacity:0.88; transform: translateY(-2px) scale(1.02); }

function roundWeight(w){ return Math.round(w*2)/2; }

function pctChange(failureReps){
  if(failureReps === undefined || failureReps === null || failureReps === '') return 0;
  const r = Number(failureReps);
  if(isNaN(r)) return 0;
  if(r < MIN_REPS){
    const shortfall = MIN_REPS - r;
    if(shortfall === 1) return -0.02;
    return -0.05; // shortfall >= 2
  }
  if(r <= FAILURE_THRESHOLD) return 0; // 5 or 6 reps: minimum met, no bonus yet
  const over = r - FAILURE_THRESHOLD; // reps beyond 6
  if(over === 1) return 0.005;
  if(over === 2) return 0.01;
  if(over === 3) return 0.015;
  if(over === 4) return 0.02;
  return 0.03; // over >= 5
}

function deltaLabel(failureReps){
  if(failureReps === undefined || failureReps === null || failureReps === '') return null;
  const p = pctChange(failureReps);
  if(p === 0) return { text:'БЕЗ ИЗМ.', cls:'' };
  const sign = p > 0 ? '+' : '';
  return { text: sign + (p*100).toFixed(1) + '%', cls: p > 0 ? 'up' : 'down' };
}

function getAllExercises(){
  const list = [];
  DAY_DEFS.forEach(d => list.push({ id: d.mainId, name: d.mainName, day: d.id, isMain:true }));
  state.accessories.forEach(a => { if(a.max !== '' && a.max !== null && !isNaN(Number(a.max)) && Number(a.max) > 0) list.push({ id:a.id, name:a.name, day:a.day, isMain:false }); });
  return list;
}

function getMax(exId){
  const mainMap = { bench: state.maxes.bench, deadlift: state.maxes.deadlift, squat: state.maxes.squat };
  if(mainMap.hasOwnProperty(exId)) return Number(mainMap[exId]) || 0;
  const acc = state.accessories.find(a => a.id === exId);
  return acc ? Number(acc.max) || 0 : 0;
}

const ACCESSORY_RANGES = {
  acc_crossover: { min:10, max:15, step:0.025 },
  acc_lateral: { min:12, max:20, step:0.025 },
  acc_curl: { min:10, max:15, step:0.025 },
  acc_rdl: { min:6, max:10, step:0.05 },
  acc_goodmorning: { min:8, max:12, step:0.05 },
  acc_dbbench: { min:8, max:12, step:0.025 },
  acc_rowh: { min:8, max:12, step:0.025 },
  acc_pullup: { min:6, max:10, step:0.05 },
  acc_plate: { min:12, max:20, step:0.025 },
  acc_shoulderpress: { min:8, max:12, step:0.025 },
  acc_tricepext: { min:10, max:15, step:0.025 },
  acc_pressdown: { min:10, max:15, step:0.025 }
};

function getAccessoryRange(exId){
  return ACCESSORY_RANGES[exId] || { min:8, max:12, step:0.025 };
}

function accessoryProgressChange(exId, entry){
  if(!entry || !Array.isArray(entry.sets)) return 0;
  const range = getAccessoryRange(exId);
  const reps = entry.sets.slice(0, NUM_SETS).map(Number).filter(Number.isFinite);
  if(reps.length < NUM_SETS) return 0;
  if(reps.some(r => r < range.min)) return -range.step;
  if(reps.every(r => r >= range.max)) return range.step;
  return 0;
}

function computeWeights(exId){
  const max = getMax(exId);
  const logs = (state.logs[exId]) || {};
  const weights = {};
  const ex = getAllExercises().find(item => item.id === exId);
  const isAccessory = ex && !ex.isMain;
  let w = roundWeight(max * 0.9);
  weights[1] = w;
  for(let wk=2; wk<=TOTAL_WEEKS; wk++){
    if(wk === DELOAD_WEEK){
      w = roundWeight(weights[wk-1] * 0.85);
      weights[wk] = w;
      continue;
    }
    if(wk === DELOAD_WEEK + 1){
      const beforeDeload = weights[DELOAD_WEEK-1];
      if(isAccessory){
        const change = accessoryProgressChange(exId, logs[DELOAD_WEEK-1]);
        w = roundWeight(beforeDeload * (1 + change));
      }else{
        const beforeEntry = logs[DELOAD_WEEK-1];
        const beforeFailure = beforeEntry ? beforeEntry.failure : '';
        w = roundWeight(beforeDeload * (1 + pctChange(beforeFailure)));
      }
      weights[wk] = w;
      continue;
    }
    const prevEntry = logs[wk-1];
    if(isAccessory){
      w = roundWeight(w * (1 + accessoryProgressChange(exId, prevEntry)));
    }else{
      const prevFailure = prevEntry ? prevEntry.failure : '';
      w = roundWeight(w * (1 + pctChange(prevFailure)));
    }
    weights[wk] = w;
  }
  return weights;
}

function getLogEntry(exId, week){
  if(!state.logs[exId]) state.logs[exId] = {};
  if(!state.logs[exId][week]) state.logs[exId][week] = { sets: ['','','',''], failure: '' };
  const entry = state.logs[exId][week];
  if(!entry.sets) entry.sets = ['','','',''];
  if(entry.sets.length > NUM_SETS) entry.sets = entry.sets.slice(0, NUM_SETS);
  while(entry.sets.length < NUM_SETS) entry.sets.push('');
  if(entry.failure === undefined) entry.failure = '';
  return entry;
}

function localStorageKey(){

async function loadLocalState(){
  try{
    const raw = localStorage.getItem(localStorageKey());
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error('Local storage read error',e); }
  return null;
}

async function loadState(){
  const local = await loadLocalState();
  if(FIREBASE_ENABLED && currentUser){
    try{
      const snap=await firebaseDb.collection('user_states').doc(currentUser.uid).get();
      if(snap.exists){
        const remote=snap.data()?.data;
        if(remote){
          try{ localStorage.setItem(localStorageKey(), JSON.stringify(remote)); }catch(_){}
          return remote;
        }
      }
      if(local){
        state=local;
        await saveState();
        return local;
      }
    }catch(e){
      console.warn('Cloud load failed, using local copy',e);
    }
  }
  return local;
}

let saveTimer=null;
async function saveState(){
  try{ localStorage.setItem(localStorageKey(), JSON.stringify(state)); }catch(e){ console.error('Storage save error',e); }
  if(FIREBASE_ENABLED && currentUser){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async()=>{
      try{
        await firebaseDb.collection('user_states').doc(currentUser.uid).set({data:state,updated_at:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      }catch(e){ console.error('Cloud save error',e); }
    },180);
  }
}

      if(nd !== '') s.maxes.deadlift = nd;
      if(ns !== '') s.maxes.squat = ns;
      s.logs = {};
      s.currentWeek = 1;
      s.cycleNumber = (s.cycleNumber || 1) + 1;
      await saveState();
      render();
    });
  }
}

/* ---------------- tab 3: КБЖУ ---------------- */
function computeBmr(k){
  const height = Number(k.height), weight = Number(k.weight), age = Number(k.age);
  return 10*weight + 6.25*height - 5*age + (k.gender === 'f' ? -161 : 5);
}

function getCalorieRange(bmr, goal, activity, weight, targetWeight){
  const activityMultiplier = { low: 1.375, mid: 1.55, high: 1.725 }[activity] || 1.55;
  const tdee = bmr * activityMultiplier;

  const w = Number(weight), t = Number(targetWeight);
  const hasTarget = w > 0 && t > 0;
  const gapKg = hasTarget ? Math.abs(t - w) : 0;
  const gapPct = hasTarget ? Math.min(gapKg / w, 0.3) : 0; // не даём разрыву раздувать дефицит/профицит бесконечно

  let low, high;
  if(goal === 'cut'){
    // база −12%, до −22% при большом разрыве с целевым весом (безопасный потолок)
    const deficitPct = 0.12 + gapPct * 0.6;
    const v = tdee * (1 - Math.min(deficitPct, 0.22));
    low = v; high = v;
  } else if(goal === 'bulk'){
    // база +250, до +500 ккал при большом разрыве с целевым весом
    const surplus = 250 + gapPct * 900;
    low = tdee + Math.min(surplus, 500);
    high = low + 100;
  } else { low = tdee; high = tdee; } // поддержание

  return { low: Math.round(low), high: Math.round(high), gapKg, tdee: Math.round(tdee) };
}

function computeMacros(weight, totalCalories){
  const proteinG = weight * 2;
  const proteinKcal = proteinG * 4;
  const fatG = weight * 1.2;
  const fatKcal = fatG * 9;
  const remainingKcal = Math.max(0, totalCalories - proteinKcal - fatKcal);
  const carbsG = remainingKcal / 4;
  return { proteinG, proteinKcal, fatG, fatKcal, carbsG, carbsKcal: remainingKcal };
}

function renderKbjuResult(){

    return;
  }

  const bmr = computeBmr(k);
  const range = getCalorieRange(bmr, k.goal, k.activity, weight, k.targetWeight);
  const mid = Math.round((range.low + range.high) / 2);
  const macros = computeMacros(weight, mid);
  const goalLabel = { cut:'Похудение', bulk:'Набор массы', maintain:'Поддержание веса' }[k.goal];
  const rangeText = range.low === range.high ? `${range.low}` : `${range.low}–${range.high}`;

  let etaHint = '';
  if(range.gapKg > 0.1 && k.goal !== 'maintain'){
    const dailyDelta = Math.abs(mid - range.tdee);
    if(dailyDelta > 20){
      const weeks = Math.max(1, Math.round((range.gapKg * 7700) / (dailyDelta * 7)));
      const verb = k.goal === 'cut' ? 'сбросить' : 'набрать';

/* ---------------- tab 4: питание (фото → КБЖУ) ---------------- */
function getTodayKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function formatDateHuman(key){
  const parts = key.split('-');
  return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

function getTodayLog(){
  if(!state.nutrition) state.nutrition = { logs: {} };
  if(!state.nutrition.logs) state.nutrition.logs = {};
  const key = getTodayKey();
  if(!state.nutrition.logs[key]) state.nutrition.logs[key] = { entries: [] };
  if(!state.nutrition.logs[key].entries) state.nutrition.logs[key].entries = [];
  return state.nutrition.logs[key];
}

function getTodayTotals(log){
  return log.entries.reduce((acc, e) => {
    acc.calories += Number(e.calories) || 0;
    acc.protein += Number(e.protein) || 0;
    acc.fat += Number(e.fat) || 0;
    acc.carbs += Number(e.carbs) || 0;
    return acc;
  }, { calories:0, protein:0, fat:0, carbs:0 });
}

function getDailyTarget(){
  const k = state.kbju;
  const height = Number(k.height), weight = Number(k.weight), age = Number(k.age);
  if(!height || !weight || !age) return null;
  const bmr = computeBmr(k);
  const range = getCalorieRange(bmr, k.goal, k.activity, weight, k.targetWeight);
  const mid = Math.round((range.low + range.high) / 2);
  const macros = computeMacros(weight, mid);
  return { calories: mid, protein: macros.proteinG, fat: macros.fatG, carbs: macros.carbsG };
}

function remainingText(target, consumed, unit){
  const rem = target - consumed;
  if(rem >= 0) return `осталось ${Math.round(rem)} ${unit}`;
  return `превышение на ${Math.round(-rem)} ${unit}`;
}

function buildCalorieRingSvg(totals, target){
  const cx = 100, cy = 100, r = 82, sw = 16;
  const circ = 2 * Math.PI * r;
  const remaining = target.calories - totals.calories;
  const remainingPct = target.calories > 0 ? Math.max(0, Math.min(1, remaining / target.calories)) : 0;
  const dash = (circ * remainingPct).toFixed(1);
  const overshoot = remaining < 0;
  const bigText = overshoot ? `+${Math.round(-remaining)}` : `${Math.round(remaining)}`;
  return `
    <svg width="200" height="200" viewBox="0 0 200 200">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface3)" stroke-width="${sw}" />

function buildMacroBarsHtml(totals, target){
  const macros = [
    { label: 'Белки',     value: totals.protein, target: target.protein, color: 'var(--steel)' },
    { label: 'Жиры',      value: totals.fat,      target: target.fat,     color: 'var(--down)' },
    { label: 'Углеводы',  value: totals.carbs,    target: target.carbs,   color: 'var(--up)' },
  ];
  return macros.map(m => {
    const remaining = m.target - m.value;
    const overshoot = remaining < 0;
    const pct = m.target > 0 ? Math.max(0, Math.min(100, (m.value / m.target) * 100)) : 0;
    const label = overshoot
      ? `${m.label} — перебор на <b>${Math.round(-remaining)} г</b>`
      : `${m.label} — осталось <b>${Math.round(remaining)} г</b>`;
    return `
      <div class="food-bar-item">
        <div class="food-bar-label">${label}</div>
        <div class="food-bar-track"><div class="food-bar-fill" style="width:${pct.toFixed(1)}%; background:${overshoot ? 'var(--down)' : m.color};"></div></div>
      </div>
    `;
  }).join('');
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    if(!file || !file.type || !file.type.startsWith('image/')){
      reject(new Error('Нужен файл изображения')); return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxSide = 1600;
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
        canvas.height = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
        const ctx = canvas.getContext('2d', {alpha:false});
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        resolve({base64:dataUrl.split(',')[1] || '', mediaType:'image/jpeg'});
      };
      img.onerror = () => reject(new Error('Не удалось подготовить фото'));
      img.src = String(reader.result || '');
    };
    reader.onerror = () => reject(new Error('Не удалось прочитать файл'));
    reader.readAsDataURL(file);
  });
}

function normalizeFoodText(s){ return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^а-яa-z0-9.,+\s-]/gi,' '); }
function findFood(text){
  const t=normalizeFoodText(text);
  const candidates=FOOD_DB.filter(f=>f.keys.some(k=>t.includes(k)));
  if(!candidates.length) return null;
  candidates.sort((a,b)=>{
    const score=f=>Math.max(...f.keys.filter(k=>t.includes(k)).map(k=>k.length))+(/бомбар|bombbar/.test(t)&&/bombbar/i.test(f.name)?50:0)+(/сникерс|snickers/.test(t)&&f.name==='Snickers'?50:0);
    return score(b)-score(a);
  });
  return candidates[0];
}
function parseNumber(s){
  const words={один:1,одна:1,одно:1,два:2,две:2,три:3,четыре:4,пять:5,шесть:6,семь:7,восемь:8,девять:9,десять:10};
  const raw=String(s).toLowerCase().trim(); if(words[raw]!==undefined) return words[raw];
  const n=parseFloat(raw.replace(',','.')); return Number.isFinite(n)?n:null;
}
function extractAmountGrams(text, food){
  const t=normalizeFoodText(text);
  const gMatch=t.match(/(\d+(?:[.,]\d+)?)\s*(г|гр|грамм|килограмм|кг|мл|миллилитр|л|литр)(?:\s|$)/);
  if(gMatch){ const n=parseNumber(gMatch[1]); if(!n)return null; if(/кг|килограмм/.test(gMatch[2]))return n*1000; if(/^(?:л|литр)$/.test(gMatch[2]))return n*1000; return n; }
  const countMatch=t.match(/(?:^|\s)(\d+(?:[.,]\d+)?|один|одна|одно|два|две|три|четыре|пять|шесть|семь|восемь|девять|десять)\s*(?:шт|штук|порц|порции|порция|кусоч|кусочка|кусок|ложк(?:а|и|у)|ст\.\s*л\.?|столов|яиц|яйца|яйцо|пирожка|пирожки|батончика|батончик|конфеты|конфет|мерн(?:ая|ой)\s*ложк(?:а|и|у)|скуп|scoop)\b/);
  if(countMatch){ const count=parseNumber(countMatch[1]); if(food.unitG)return count*food.unitG; if(food.unit==='egg')return count*60; if(food.unit==='spoon'||food.unit==='scoop')return count*food.unitG||30; return count*100; }
  if(food.unitG){ const piece=t.match(/(?:^|\s)(\d+(?:[.,]\d+)?)(?=\s|$)/); const n=piece?parseNumber(piece[1]):null; if(n)return n*food.unitG; }
  return null;
}
function splitFoodParts(raw){ return String(raw||'').replace(/\s+и\s+/gi,',').replace(/\s*\+\s*/g,',').split(/[,;]+/).map(x=>x.trim()).filter(Boolean); }
function combineFoodResults(items,raw){
  const valid=items.filter(x=>x.food&&x.g>0); if(!valid.length)throw new Error('Не удалось разобрать продукты.');
  const sum=valid.reduce((a,x)=>({calories:a.calories+x.food.kcal*x.g/100,protein:a.protein+x.food.p*x.g/100,fat:a.fat+x.food.f*x.g/100,carbs:a.carbs+x.food.c*x.g/100}),{calories:0,protein:0,fat:0,carbs:0});
  return {name:raw,...sum};
}
function estimateFood(description){
  const raw=String(description||'').trim(); if(!raw)throw new Error('Напиши продукт и примерную порцию.');
  const parts=splitFoodParts(raw), parsed=[];
  for(const part of parts){ const food=findFood(part); if(!food)continue; let g=extractAmountGrams(part,food); if(!g)g=food.unitG||(food.unit==='egg'?60:food.unit==='scoop'?30:100); parsed.push({food,g}); }
  if(!parsed.length){ const food=findFood(raw); if(food){ const g=extractAmountGrams(raw,food)||food.unitG||(food.unit==='egg'?60:food.unit==='scoop'?30:100); parsed.push({food,g}); } }
  if(!parsed.length)throw new Error('Не нашёл продукт в локальной базе. Используй поиск базы или напиши состав блюда.');
  return combineFoodResults(parsed,raw);
}
function offNutriments(product){
  const n=product&&product.nutriments||{};
  const kcal=Number(n['energy-kcal_100g'] ?? n['energy-kcal'] ?? 0);
  const p=Number(n.proteins_100g ?? n.proteins ?? 0), f=Number(n.fat_100g ?? n.fat ?? 0), c=Number(n.carbohydrates_100g ?? n.carbohydrates ?? 0);
  if(!kcal&&!p&&!f&&!c)return null;
  return {kcal,p,f,c};
}
function offProductResult(product){
  const nut=offNutriments(product); if(!nut)return null;
  return {name:[product.product_name,product.brands].filter(Boolean).join(' — '),kcal:nut.kcal,p:nut.p,f:nut.f,c:nut.c,source:'Open Food Facts',code:product.code||'',image:product.image_front_small_url||product.image_front_url||''};
}
async function searchOpenFoodFacts(query){
  const q=String(query||'').trim(); if(!q)return [];
  const url='https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=12&fields=code,product_name,brands,nutriments,image_front_small_url,image_front_url';
  const res=await fetch(url,{headers:{'Accept':'application/json'}}); if(!res.ok)throw new Error('Не удалось открыть базу продуктов.');
  const data=await res.json(); return (data.products||[]).map(offProductResult).filter(Boolean);
}
async function getOpenFoodFactsByCode(code){
  const clean=String(code||'').replace(/\D/g,''); if(!clean)return null;
  const res=await fetch('https://world.openfoodfacts.org/api/v3/product/'+encodeURIComponent(clean)+'.json?fields=code,product_name,brands,nutriments,image_front_small_url,image_front_url',{headers:{'Accept':'application/json'}});
  if(!res.ok)return null; const data=await res.json(); return data.status===1?offProductResult(data.product):null;
}
function addRemoteFoodResult(item,grams){
  const g=Number(grams)||100; return {name:item.name,calories:item.kcal*g/100,protein:item.p*g/100,fat:item.f*g/100,carbs:item.c*g/100};
}

async function handleFoodSearch(){
  const input=document.getElementById('food-search-input'), status=document.getElementById('food-status'), results=document.getElementById('food-search-results');

    results.innerHTML=items.map((x,i)=>`<button type="button" class="food-search-item" data-i="${i}"><span><b>${escapeHtml(x.name||'Без названия')}</b><small>${Math.round(x.kcal)} ккал · Б ${x.p.toFixed(1)} · Ж ${x.f.toFixed(1)} · У ${x.c.toFixed(1)} на 100 г</small></span><strong>Добавить</strong></button>`).join('');
    results.querySelectorAll('.food-search-item').forEach(btn=>btn.addEventListener('click',async()=>{ const x=items[Number(btn.dataset.i)]; const g=Number(prompt('Сколько граммов?', '100')); if(!g)return; status.textContent='Добавляем…'; await addFoodResult(addRemoteFoodResult(x,g)); renderFoodTab(); }));
    status.textContent='Найдено продуктов: '+items.length+'.';
  }catch(err){ status.textContent=err.message||'Ошибка поиска базы.'; status.classList.add('error'); }
}
function renderFoodTab(){
  if(foodSubTab==='stats'){renderFoodStatistics();return;}
  const content=document.getElementById('tab-content'),target=getDailyTarget(),log=getTodayLog(),totals=getTodayTotals(log);
  let ringsBlock=''; if(target){ringsBlock=`<div class="panel"><div class="panel-title">Осталось съесть сегодня</div><div class="food-rings-wrap"><div class="food-ring-col">${buildCalorieRingSvg(totals,target)}</div><div class="food-bars-col">${buildMacroBarsHtml(totals,target)}</div></div></div>`;}
  const entriesHtml=log.entries.length?log.entries.map((e,idx)=>`<div class="food-entry"><div><div class="food-entry-name">${escapeHtml(e.name||'Приём пищи')}</div><div class="food-entry-macros">${Math.round(e.calories)} ккал · Б ${Math.round(e.protein)} · Ж ${Math.round(e.fat)} · У ${Math.round(e.carbs)}</div></div><button class="food-entry-del" data-idx="${idx}" title="Удалить запись">✕</button></div>`).join(''):`<p class="empty-note">Сегодня ещё нет записей о еде.</p>`;
  content.innerHTML=`<div class="panel"><div class="panel-title">Дневник питания — ${formatDateHuman(getTodayKey())}</div><div class="food-subnav"><button class="food-subbtn active">Дневник</button><button class="food-subbtn" id="food-stats-btn">Статистика</button></div>
    <div class="food-search-row"><input type="text" id="food-search-input" placeholder="Найти любой продукт, блюдо или бренд…"><button class="food-text-btn" id="food-search-btn">Найти</button></div>
    <div id="food-search-results" class="food-search-results"></div>
    <div class="food-ai-note">📷 Распознавание еды по фотографии временно отключено. Используй поиск продукта или введи еду текстом — сайт посчитает КБЖУ.</div>
    <div class="food-text-row"><input type="text" id="food-text-input" placeholder="Например: 80 г хлопьев и 200 мл молока"><button class="food-text-btn" id="food-text-btn">Добавить</button></div>
    <div class="food-status" id="food-status" style="margin-top:8px;"></div>
  </div>${ringsBlock}<div class="panel"><div class="panel-title">Записи за сегодня</div><div class="food-entries">${entriesHtml}</div></div>`;
  document.getElementById('food-stats-btn').addEventListener('click',()=>{foodSubTab='stats';renderFoodTab();});
  document.getElementById('food-text-btn').addEventListener('click',handleFoodTextSubmit);
  document.getElementById('food-search-btn').addEventListener('click',handleFoodSearch);
  document.getElementById('food-search-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();handleFoodSearch();}});
  document.getElementById('food-text-input').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();handleFoodTextSubmit();}});
  content.querySelectorAll('.food-entry-del').forEach(btn=>btn.addEventListener('click',async()=>{const idx=Number(btn.dataset.idx);log.entries.splice(idx,1);await saveState();renderFoodTab();}));
}

function authErrorMessage(err){
  const code=String(err?.code||'');
  const msg=String(err?.message||err||'Ошибка входа');
  if(/invalid-credential|wrong-password|user-not-found/i.test(code+' '+msg)) return 'Неверная почта или пароль.';
  if(/too-many-requests/i.test(code)) return 'Слишком много попыток. Попробуй позже.';
  if(/network-request-failed/i.test(code)) return 'Нет соединения с Firebase. Проверь интернет.';
  return msg;
}

function showAuthScreen(){
  const el=document.getElementById('auth-screen');
  el.style.display='flex';
  el.innerHTML=`<div class="auth-card">
    <div class="auth-kicker">закрытый доступ</div>
    <div class="auth-title">Петергофский цикл</div>
    <div class="auth-sub">Войди в свой аккаунт. Твои тренировки и питание будут синхронизироваться между телефоном и компьютером.</div>
    <form id="auth-form">
      <div class="auth-field"><label>Почта</label><input id="auth-email" type="email" autocomplete="username" required></div>
      <div class="auth-field"><label>Пароль</label><input id="auth-password" type="password" autocomplete="current-password" required></div>
      <button class="auth-btn" id="auth-submit">Войти</button>
      <div class="auth-error" id="auth-error"></div>
    </form>
    <div class="auth-local">Доступ выдаётся только существующим аккаунтам. Регистрация из сайта отключена.</div>
  </div>`;
  document.getElementById('auth-form').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=document.getElementById('auth-submit'), errEl=document.getElementById('auth-error');
    btn.disabled=true; errEl.textContent='';
    try{
      const cred=await firebaseAuth.signInWithEmailAndPassword(document.getElementById('auth-email').value.trim(),document.getElementById('auth-password').value);
      currentUser=cred.user;
    }catch(error){ errEl.textContent=authErrorMessage(error); btn.disabled=false; return; }
    el.style.display='none';
    await startApp();
  });
}

async function startApp(){
  const loaded=await loadState();
  state=loaded||freshState();
  if(!state.accessories) state.accessories=JSON.parse(JSON.stringify(DEFAULT_ACCESSORIES));
  if(!state.logs) state.logs={};
  if(!state.currentWeek) state.currentWeek=1;
  if(!state.cycleNumber) state.cycleNumber=1;
  if(!state.kbju) state.kbju={height:'',weight:'',age:'',gender:'m',goal:'maintain',activity:'mid',targetWeight:''};
  if(!state.kbju.gender) state.kbju.gender='m';
  if(state.kbju.targetWeight===undefined) state.kbju.targetWeight='';
  if(!state.nutrition) state.nutrition={logs:{}};
  if(!state.nutrition.logs) state.nutrition.logs={};
  activeTab=hasMaxesSet(state)?'cycle':'maxes';
  render();
}

async function init(){
  if(FIREBASE_ENABLED){
    try{
      firebaseApp=firebase.initializeApp(window.PETERHOF_FIREBASE_CONFIG);
      if(window.firebase.appCheck){
        const appCheck=firebase.appCheck();
        appCheck.activate(new firebase.appCheck.ReCaptchaEnterpriseProvider(RECAPTCHA_ENTERPRISE_SITE_KEY), true);
      }
      firebaseAuth=firebase.auth();
      firebaseDb=firebase.firestore();
      firebaseAuth.onAuthStateChanged(async(user)=>{
        if(user){
          currentUser=user;
          document.getElementById('auth-screen').style.display='none';
          await startApp();
        }else{
          currentUser=null;
          document.getElementById('app').innerHTML='';
          showAuthScreen();
        }
      });
      return;
    }catch(e){
      console.error('Firebase init error',e);
      document.getElementById('loading').textContent='ОШИБКА НАСТРОЙКИ FIREBASE';
      return;
    }
  }
  await startApp();
}
init();
</script>
